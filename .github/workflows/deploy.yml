# .github/workflows/deploy-backend.yml
name: 🚀 Déployer le Backend DIAMBRA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Ignorer les tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  APP_DIR: "/var/www/diambrabackend"
  PM2_NAME: "diambra-backend"
  BACKEND_PORT: 3001
  HEALTH_CHECK_ENDPOINT: "/api/v1"
  DEPLOY_TIMESTAMP: ${{ github.run_id }}

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.inputs.skip_tests }}

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🧹 ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🧪 Tests unitaires
        run: npm test --if-present
        continue-on-error: true

  build-and-package:
    name: 📦 Build & Package
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: always() && (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped')
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Build de production
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🔍 Vérification du build
        run: |
          if [ ! -f "dist/main.js" ]; then
            echo "❌ dist/main.js introuvable"
            ls -la dist/
            exit 1
          fi
          echo "✅ Build valide: dist/main.js présent"

      - name: 🔐 Analyse de sécurité
        run: npm audit --production --audit-level=high || true

      - name: 📝 Génération du fichier de version
        run: |
          cat > version.json << EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "version": "$(node -p "require('./package.json').version")",
            "deploy_id": "${{ env.DEPLOY_TIMESTAMP }}",
            "environment": "${{ github.event.inputs.environment || 'production' }}"
          }
          EOF

      - name: 💾 Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            dist/
            package.json
            package-lock.json
            version.json
          retention-days: 3
          compression-level: 6

  deploy-production:
    name: 🚀 Déploiement sur VPS
    runs-on: ubuntu-latest
    needs: build-and-package
    timeout-minutes: 15
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: 📥 Téléchargement du build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./deploy

      - name: 📤 Envoi des fichiers vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/*"
          target: "${{ env.APP_DIR }}/new_deploy"
          strip_components: 1
          overwrite: true

      - name: 🔧 Déploiement atomique & Redémarrage PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Lancement du déploiement - ${{ env.DEPLOY_TIMESTAMP }}"
            cd ${{ env.APP_DIR }}

            # 1. Vérification rapide de l'espace disque
            DISK_USAGE=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
            if [ "$DISK_USAGE" -gt 90 ]; then
              echo "❌ Espace disque critique (${DISK_USAGE}%)"
              exit 1
            fi

            # 2. Sauvegarde de la version actuelle
            if [ -d "dist" ]; then
              BACKUP_DIR="backups/backup_$(date +%Y%m%d_%H%M%S)"
              mkdir -p "$BACKUP_DIR"
              cp -r dist package.json package-lock.json version.json "$BACKUP_DIR/" 2>/dev/null || true
              ls -dt backups/backup_* | tail -n +6 | xargs -r rm -rf
            fi

            # 3. Vérification légère de MongoDB et Redis
            systemctl is-active --quiet mongod || systemctl start mongod || echo "⚠️ Attention: MongoDB indisponible"
            systemctl is-active --quiet redis-server || systemctl start redis-server || echo "⚠️ Attention: Redis indisponible"

            # 4. Dossiers requis
            mkdir -p /var/www/uploads/books /var/www/uploads/temp logs backups

            # 5. Remplacement des fichiers
            rm -rf dist.old
            [ -d "dist" ] && mv dist dist.old
            mv new_deploy/dist ./dist
            cp new_deploy/package.json ./package.json
            cp new_deploy/package-lock.json ./package-lock.json
            cp new_deploy/version.json ./version.json 2>/dev/null || true
            rm -rf new_deploy

            # 6. Installation dépendances prod
            npm ci --omit=dev --silent --no-audit --no-fund

            # 7. Mise à jour / Création de l'environnement .env
            if [ ! -f ".env" ]; then
              cat > .env << 'ENVEOF'
            PORT=3001
            NODE_ENV=production
            BASE_URL=https://diambra.net
            CORS_ORIGINS=https://diambra.net,https://www.diambra.net
            MONGODB_URI=mongodb://localhost:27017/diambra
            REDIS_HOST=localhost
            REDIS_PORT=6379
            REDIS_KEY_PREFIX=diambra:
            UPLOAD_DIR=/var/www/uploads/books
            PUBLIC_UPLOAD_URL=https://diambra.net/uploads
            THROTTLE_TTL=60
            THROTTLE_LIMIT=100
            ENVEOF
            fi

            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${{ secrets.JWT_SECRET }}|" .env || echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}|" .env || echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env

            # 8. Reload / Restart PM2
            if pm2 describe ${{ env.PM2_NAME }} > /dev/null 2>&1; then
              pm2 reload ${{ env.PM2_NAME }} --update-env
            else
              pm2 start dist/main.js \
                --name "${{ env.PM2_NAME }}" \
                --time \
                --instances max \
                --exp-backoff-restart-delay=100 \
                --node-args="--max-old-space-size=512"
            fi

            # 9. Healthcheck avec boucles d'attente (30s max)
            echo "⏳ Validation du service..."
            SUCCESS=0
            for i in {1..6}; do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.BACKEND_PORT }}${{ env.HEALTH_CHECK_ENDPOINT }} || echo "000")
              if [[ "$HTTP_CODE" =~ ^(200|301|302|304)$ ]]; then
                SUCCESS=1
                break
              fi
              echo "Tentative $i/6: Code HTTP $HTTP_CODE..."
            done

            if [ $SUCCESS -eq 1 ]; then
              echo "✅ Déploiement réussi (HTTP $HTTP_CODE)"
              pm2 save --force
              rm -rf dist.old
            else
              echo "❌ Échec du Healthcheck. Affichage des logs PM2 :"
              pm2 logs ${{ env.PM2_NAME }} --lines 30 --nostream
              exit 1
            fi

  rollback:
    name: ↩️ Rollback Automatique
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    timeout-minutes: 5

    steps:
      - name: ↩️ Restauration de la dernière version stable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ env.APP_DIR }}
            LATEST_BACKUP=$(ls -dt backups/backup_* 2>/dev/null | head -1)

            if [ -n "$LATEST_BACKUP" ]; then
              echo "↩️ Restauration depuis $LATEST_BACKUP..."
              rm -rf dist
              cp -r "$LATEST_BACKUP/dist" ./dist
              cp "$LATEST_BACKUP/package.json" ./package.json 2>/dev/null || true
              cp "$LATEST_BACKUP/package-lock.json" ./package-lock.json 2>/dev/null || true
              
              pm2 reload ${{ env.PM2_NAME }} || pm2 restart ${{ env.PM2_NAME }}
              echo "✅ Rollback exécuté avec succès"
            else
              echo "⚠️ Aucun dossier de backup trouvé pour exécuter le rollback."
            fi